<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitBot - แชทบอทแนะนำการออกกำลังกาย</title>

<style>
  * { box-sizing: border-box; }

  :root {
    --orange: #ff7a00;
    --orange-light: #ffa24d;
    --orange-soft: #fff1e2;
    --orange-dark: #d85f00;
  }

  body {
    margin: 0;
    font-family: "Sarabun", "Noto Sans Thai", sans-serif;
    background: linear-gradient(160deg, #fff6ec, #ffe3c7);
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 500px;
    height: 92vh;
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(216, 95, 0, 0.25);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- ส่วนหัว ---------- */
  header {
    background: linear-gradient(135deg, var(--orange), var(--orange-light));
    color: white;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .logo {
    font-size: 38px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: bounce 1.6s ease-in-out infinite;
  }
  .head-text h1 { margin: 0; font-size: 22px; letter-spacing: 0.5px; }
  .head-text p  { margin: 2px 0 0; font-size: 12px; opacity: 0.95; }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    margin-top: 4px;
  }
  .dot {
    width: 8px; height: 8px;
    background: #4cff88;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }

  /* ---------- กล่องแชท ---------- */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fffaf4;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 16px;
    line-height: 1.55;
    white-space: pre-line;
    font-size: 15px;
    animation: slideUp 0.3s ease;
  }
  .msg.bot  {
    background: var(--orange-soft);
    color: #3b2a1a;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
    border-left: 3px solid var(--orange);
  }
  .msg.user {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: white;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }

  /* จุดสามจุดตอนบอทกำลังพิมพ์ */
  .typing {
    align-self: flex-start;
    background: var(--orange-soft);
    border-radius: 16px;
    border-bottom-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    animation: slideUp 0.3s ease;
  }
  .typing span {
    width: 8px; height: 8px;
    background: var(--orange);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  /* ---------- พื้นที่ปุ่มเลือกหมวด / คำถาม ---------- */
  .quick {
    padding: 10px 14px;
    border-top: 1px solid #ffe0c2;
    max-height: 210px;
    overflow-y: auto;
    background: white;
  }
  .quick .title {
    font-size: 12px;
    color: #8a6a4a;
    margin-bottom: 8px;
  }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }
  .list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .quick button {
    background: white;
    border: 1.5px solid var(--orange);
    color: var(--orange-dark);
    border-radius: 14px;
    padding: 8px 10px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    text-align: left;
    transition: transform 0.15s, background 0.15s, color 0.15s;
  }
  .quick button:hover {
    background: var(--orange);
    color: white;
    transform: translateY(-2px);
  }
  .quick button.back {
    border-color: #aaa;
    color: #666;
    margin-bottom: 8px;
  }
  .quick button.back:hover { background: #888; color: white; }

  /* ---------- ช่องพิมพ์ ---------- */
  form {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid #ffe0c2;
    background: white;
  }
  form input {
    flex: 1;
    padding: 10px 16px;
    border: 1.5px solid #ffcfa0;
    border-radius: 22px;
    font-size: 15px;
    font-family: inherit;
    outline: none;
  }
  form input:focus { border-color: var(--orange); }
  form button {
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: white;
    border: none;
    border-radius: 22px;
    padding: 0 20px;
    font-size: 15px;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s;
  }
  form button:hover { transform: scale(1.06); }

  /* ---------- แอนิเมชัน ---------- */
  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    30%      { transform: translateY(-8px) rotate(-8deg); }
    60%      { transform: translateY(0) rotate(8deg); }
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(76,255,136,0.7); }
    70%  { box-shadow: 0 0 0 8px rgba(76,255,136,0); }
    100% { box-shadow: 0 0 0 0 rgba(76,255,136,0); }
  }
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 80%, 100% { opacity: 0.25; transform: scale(0.8); }
    40%           { opacity: 1;    transform: scale(1.1); }
  }

  /* ผู้ใช้ที่ปิดแอนิเมชันในเครื่อง จะไม่เห็นการขยับ */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>

<body>
<div class="app">
  <header>
    <div class="logo">💪</div>
    <div class="head-text">
      <h1>FitBot</h1>
      <p>แนะนำการออกกำลังกาย (ข้อมูลทั่วไป ไม่ใช่คำแนะนำทางการแพทย์)</p>
      <div class="status"><span class="dot"></span> ออนไลน์</div>
    </div>
  </header>

  <div id="chat" class="chat"></div>
  <div id="quick" class="quick"></div>

  <form id="form">
    <input id="input" type="text" placeholder="พิมพ์คำถามที่นี่..." autocomplete="off">
    <button type="submit">ส่ง 🚀</button>
  </form>
</div>

<script>
  // ===== 1) คลังความรู้ของบอท (แก้ไข/เพิ่มได้ที่นี่) =====
  // categories = หมวดหมู่ แต่ละหมวดมีรายการคำถาม (items)
  // q = ข้อความคำถามที่แสดงบนปุ่ม
  // k = คำสำคัญ ถ้าผู้ใช้พิมพ์คำเหล่านี้ บอทจะเลือกคำตอบข้อนี้
  //     (ถ้าใส่ [] แปลว่าข้อนี้ตอบได้เฉพาะตอนกดปุ่ม เพราะมีข้อที่ซ้ำกันในหมวดอื่นแล้ว)
  // a = คำตอบ (ใช้ \n เพื่อขึ้นบรรทัดใหม่)
  const categories = [
    {
      name: "🌱 เริ่มต้นออกกำลังกาย",
      items: [
        { q: "ควรเริ่มออกกำลังกายจากอะไร?",
          k: ["เริ่มจากอะไร", "เริ่มออกกำลังกาย", "เริ่มต้น"],
          a: "เริ่มจากกิจกรรมเบาๆ ที่ทำได้ต่อเนื่อง เช่น เดินเร็ว ปั่นจักรยาน ว่ายน้ำ หรือท่าที่ใช้น้ำหนักตัว แล้วค่อยๆ เพิ่มเวลาและความหนักทีละน้อย สิ่งสำคัญที่สุดคือทำให้สม่ำเสมอ ไม่ต้องหักโหมตั้งแต่วันแรก" },
        { q: "มือใหม่ควรออกกำลังกายกี่วันต่อสัปดาห์?",
          k: ["กี่วันต่อสัปดาห์", "กี่วันต่ออาทิตย์", "สัปดาห์ละกี่วัน", "วันเว้นวัน"],
          a: "มือใหม่เริ่มที่ 3 วันต่อสัปดาห์ก็เพียงพอ เช่น จันทร์ พุธ ศุกร์ เพื่อให้ร่างกายมีวันพักฟื้น เมื่อเริ่มชินแล้วค่อยเพิ่มเป็น 4-5 วัน" },
        { q: "ควรออกกำลังกายวันละกี่นาที?",
          k: ["วันละกี่นาที", "กี่นาที", "นานแค่ไหน"],
          a: "ช่วงเริ่มต้นประมาณ 20-30 นาทีต่อวันก็เริ่มเห็นประโยชน์แล้ว เป้าหมายทั่วไปสำหรับผู้ใหญ่คือออกกำลังกายความหนักปานกลางรวมประมาณ 150 นาทีต่อสัปดาห์ แบ่งเป็นวันละ 20-30 นาทีได้เลย" },
        { q: "ไม่เคยออกกำลังกายมาก่อนควรทำอย่างไร?",
          k: ["ไม่เคยออกกำลังกาย", "ไม่เคยออก", "ไม่เคยเล่น"],
          a: "ให้เริ่มช้าๆ ดังนี้\n• สัปดาห์แรก: เดิน 15-20 นาที 3 วัน\n• ค่อยๆ เพิ่มเวลาหรือความเร็วทีละนิด\n• เพิ่มท่าน้ำหนักตัวเบาๆ เช่น squat กับเก้าอี้\n• ฟังร่างกายตัวเอง เหนื่อยมากให้พัก\nถ้ามีโรคประจำตัวหรืออายุมาก ควรปรึกษาแพทย์ก่อนเริ่ม" },
        { q: "ควรออกกำลังกายตอนเช้าหรือตอนเย็น?",
          k: ["ตอนเช้า", "ตอนเย็น", "เช้าหรือเย็น", "เวลาไหนดี"],
          a: "ผลดีใกล้เคียงกัน ให้เลือกเวลาที่ทำได้สม่ำเสมอที่สุด ตอนเช้าอากาศเย็นกว่าและช่วยให้ตื่นตัว ตอนเย็นร่างกายอุ่นพร้อมกว่า แต่ไม่ควรออกกำลังกายหนักใกล้เวลานอนเกินไป ถ้าทำแล้วหลับยาก" },
        { q: "ต้องวอร์มอัพก่อนออกกำลังกายหรือไม่?",

        { q: "ออกกำลังกายที่บ้านกับที่ฟิตเนสต่างกันอย่างไร?",
          k: ["ที่บ้านกับ", "บ้านกับฟิตเนส", "ฟิตเนสต่าง", "บ้านหรือฟิตเนส"],

        { q: "ต้องเตรียมอุปกรณ์อะไรบ้าง?",

          a: "พื้นฐานที่ควรมี\n• รองเท้าผ้าใบที่เหมาะกับกิจกรรม\n• เสื้อผ้าที่ระบายอากาศ\n• ขวดน้ำ\n• เสื่อ (ถ้าทำท่าบนพื้น)\nส่วนอุปกรณ์อื่นๆ ค่อยซื้อเพิ่มทีหลังได้" }
      ]
    },
    {
      name: "🏋️ ท่าออกกำลังกาย",
      items: [
        { q: "Squat ทำอย่างไรให้ถูกวิธี?",
          k: ["squat", "สควอท", "สควอช"],
          a: "วิธีทำ Squat\n1. ยืนกางขาเท่าความกว้างไหล่ ปลายเท้าชี้ออกเล็กน้อย\n2. เก็บหน้าท้อง หลังตรง อกผาย\n3. ดันสะโพกไปด้านหลังแล้วย่อลงเหมือนนั่งเก้าอี้\n4. เข่าชี้ไปทางเดียวกับปลายเท้า ไม่พับเข้าด้านใน\n5. ส้นเท้าติดพื้น ย่อลงจนต้นขาขนานพื้นเท่าที่ทำได้\n6. ดันส้นเท้ากลับขึ้นมายืนตรง" },
        { q: "Push-up ช่วยบริหารกล้ามเนื้อส่วนไหน?",

          a: "Push-up บริหารกล้ามเนื้ออก ไหล่ด้านหน้า และกล้ามเนื้อต้นแขนด้านหลัง (ไตรเซ็ปส์) พร้อมกับกล้ามเนื้อแกนกลางลำตัว มือใหม่เริ่มจากวิดพื้นกับผนังหรือวิดพื้นแบบเข่าแตะพื้นได้" },

        { q: "ท่าออกกำลังกายสำหรับผู้เริ่มต้นมีอะไรบ้าง?",

        { q: "ควรทำกี่เซตและกี่ครั้งต่อท่า?",

      ]
    },
    {
      name: "🥗 อาหารและน้ำหนัก",
      items: [

  const quick = document.getElementById("quick");
  const form  = document.getElementById("form");
  const input = document.getElementById("input");

  // เพิ่มข้อความใหม่ลงในกล่องแชท
  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;   // who = "bot" หรือ "user"
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight; // เลื่อนลงล่างสุดอัตโนมัติ
  }

  // แสดงจุดสามจุด "กำลังพิมพ์..." แล้วคืนตัวองค์ประกอบไว้ให้ลบทีหลัง
  function showTyping() {
    const div = document.createElement("div");
    div.className = "typing";
    div.innerHTML = "<span></span><span></span><span></span>";
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }


  // ===== 3) สมองของบอท =====
  // รวมทุกหัวข้อไว้ในรายการเดียวสำหรับค้นหาจากข้อความที่พิมพ์
  const allItems = extras.slice();
  categories.forEach(function (cat) {
    cat.items.forEach(function (item) { allItems.push(item); });
  });

  // ให้คะแนนแต่ละหัวข้อ: เจอคำสำคัญไหน ก็บวกคะแนนเท่าความยาวคำนั้น
  // (คำยาวและเฉพาะเจาะจงจึงมีน้ำหนักมากกว่าคำสั้น) แล้วเลือกหัวข้อที่ได้คะแนนสูงสุด
  function findAnswer(question) {
    const q = question.toLowerCase();
    let best = null;
    let bestScore = 0;

    for (const item of allItems) {
      let score = 0;
      for (const k of item.k) {
        if (q.includes(k.toLowerCase())) score += k.length;
      }
      if (score > bestScore) {
        best = item;
        bestScore = score;
      }
    }
    return best ? best.a : fallback;
  }

  // เมื่อมีคำถามเข้ามา: โชว์คำถาม -> โชว์จุดกำลังพิมพ์ -> โชว์คำตอบ
  // ถ้ากดจากปุ่ม จะส่ง item มาด้วย เพื่อตอบตรงข้อ 100%
  function ask(text, item) {
    addMessage(text, "user");
    const typing = showTyping();
    setTimeout(function () {
      typing.remove();
      addMessage(item ? item.a : findAnswer(text), "bot");
    }, 700);
  }


  // ===== 4) ปุ่มเลือกหมวดและปุ่มคำถาม =====
  function showCategories() {
    quick.innerHTML = "";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "👇 เลือกหมวดที่สนใจ หรือพิมพ์ถามได้เลย";
    quick.appendChild(title);

    const grid = document.createElement("div");
    grid.className = "grid";
    categories.forEach(function (cat) {
      const btn = document.createElement("button");
      btn.textContent = cat.name;
      btn.addEventListener("click", function () { showQuestions(cat); });
      grid.appendChild(btn);
    });
    quick.appendChild(grid);
    quick.scrollTop = 0;
  }

  function showQuestions(cat) {
    quick.innerHTML = "";

    const back = document.createElement("button");
    back.textContent = "← กลับไปเลือกหมวด";
    back.className = "back";
    back.addEventListener("click", showCategories);
    quick.appendChild(back);

    const list = document.createElement("div");
    list.className = "list";
    cat.items.forEach(function (item) {
      const btn = document.createElement("button");
      btn.textContent = item.q;
      btn.addEventListener("click", function () { ask(item.q, item); });
      list.appendChild(btn);
    });
    quick.appendChild(list);
    quick.scrollTop = 0;
  }


  // ===== 5) เริ่มทำงาน =====
  form.addEventListener("submit", function (e) {
    e.preventDefault();               // กันหน้าเว็บรีโหลด
    const text = input.value.trim();
    if (text === "") return;
    input.value = "";
    ask(text);
  });

  addMessage("สวัสดีครับ ยินดีให้คำแนะนำเกี่ยวกับการออกกำลังกาย", "bot");
  showCategories();
</script>
</body>
</html>
