<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แชทบอทแนะนำการออกกำลังกาย</title>

<style>
  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Sarabun", "Noto Sans Thai", sans-serif;
    background: #eef6f0;
    display: flex;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 92vh;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: #1f8a4c;
    color: white;
    padding: 16px;
  }
  header h1 { margin: 0; font-size: 20px; }
  header p  { margin: 4px 0 0; font-size: 12px; opacity: 0.9; }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-line;
    font-size: 15px;
  }
  .msg.bot  { background: #e6f3ea; align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.user { background: #1f8a4c; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }

  .quick {
    padding: 8px 16px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    border-top: 1px solid #e5e5e5;
    max-height: 170px;
    overflow-y: auto;
  }
  .quick .title {
    width: 100%;
    font-size: 12px;
    color: #666;
  }
  .quick button {
    background: white;
    border: 1px solid #1f8a4c;
    color: #1f8a4c;
    border-radius: 20px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
    text-align: left;
  }
  .quick button:hover { background: #1f8a4c; color: white; }
  .quick button.back { border-color: #888; color: #555; }
  .quick button.back:hover { background: #888; color: white; }

  form {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    border-top: 1px solid #e5e5e5;
  }
  form input {
    flex: 1;
    padding: 10px 14px;
    border: 1px solid #ccc;
    border-radius: 20px;
    font-size: 15px;
    outline: none;
  }
  form button {
    background: #1f8a4c;
    color: white;
    border: none;
    border-radius: 20px;
    padding: 0 20px;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>

<body>
<div class="app">
  <header>
    <h1>💪 น้องฟิต</h1>
    <p>แนะนำการออกกำลังกาย (ข้อมูลทั่วไป ไม่ใช่คำแนะนำทางการแพทย์)</p>
  </header>

  <div id="chat" class="chat"></div>
  <div id="quick" class="quick"></div>

  <form id="form">
    <input id="input" type="text" placeholder="พิมพ์คำถามที่นี่..." autocomplete="off">
    <button type="submit">ส่ง</button>
  </form>
</div>

        { q: "สามารถออกกำลังกายที่บ้านโดยไม่เข้าฟิตเนสได้ไหม?",
          k: ["ไม่เข้าฟิตเนส", "ไม่ไปฟิตเนส", "ที่บ้านได้ไหม", "ออกกำลังกายที่บ้าน"],
          a: "ได้ ออกกำลังกายที่บ้านได้ผลดีมาก ใช้ท่าน้ำหนักตัว เช่น squat, push-up, lunge, plank ร่วมกับเดินหรือวิ่งหน้าบ้าน เพิ่มยางยืดหรือดัมเบลได้เมื่อพร้อม สิ่งสำคัญคือความสม่ำเสมอ ไม่ใช่สถานที่" },
        { q: "ช่วยแนะนำกิจกรรมออกกำลังกายตามเวลาว่างได้ไหม?",
          k: ["เวลาว่าง", "กิจกรรมออกกำลังกาย", "กิจกรรม"],
          a: "เลือกตามเวลาที่มี\n• 10 นาที: เดินเร็ว ยืดเหยียด กระโดดเชือก\n• 20-30 นาที: วงจรน้ำหนักตัว วิ่งเบาๆ ปั่นจักรยาน\n• 1 ชั่วโมงขึ้นไป: ฟิตเนส ว่ายน้ำ แบดมินตัน หรือกีฬาที่ชอบ\nกิจกรรมที่สนุกจะทำให้ทำต่อเนื่องได้นานกว่า" }

    },
    {
      name: "🎽 อุปกรณ์ออกกำลังกาย",
      items: [
        { q: "ดัมเบลเหมาะกับการออกกำลังกายแบบไหน?",
          k: ["ดัมเบลเหมาะ", "ดัมเบล", "dumbbell"],
          a: "ดัมเบลเหมาะกับการฝึกความแข็งแรงและสร้างกล้ามเนื้อ ใช้ได้ทั้งแขน ไหล่ อก หลัง และขา ข้อดีคือใช้พื้นที่น้อย ปรับท่าได้หลากหลาย และฝึกกล้ามเนื้อสองข้างแยกกันได้ ควรเริ่มจากน้ำหนักเบาแล้วค่อยเพิ่ม" },
        { q: "เสื่อโยคะจำเป็นหรือไม่?",
          k: ["เสื่อโยคะ", "เสื่อ"],
          a: "ไม่จำเป็นเสมอไป แต่มีประโยชน์ถ้าทำท่าบนพื้น เช่น plank, crunch, โยคะ ช่วยกันลื่นและรองรับแรงกดที่ข้อศอกและหลัง ถ้าไม่มีสามารถใช้พื้นที่ไม่ลื่นหรือผ้าห่มหนาๆ แทนได้" },
        { q: "ลู่วิ่งกับจักรยานออกกำลังกายต่างกันอย่างไร?",
          k: ["ลู่วิ่ง", "จักรยานออกกำลังกาย", "จักรยาน"],
          a: "• ลู่วิ่ง: เหมือนการเดิน/วิ่งจริง เผาผลาญพลังงานได้มาก แต่มีแรงกระแทกที่เข่าและข้อเท้ามากกว่า\n• จักรยานออกกำลังกาย: แรงกระแทกต่ำ เหมาะกับคนเข่าไม่ดีหรือเพิ่งเริ่ม เน้นกล้ามเนื้อขา\nเลือกตามความชอบและสภาพร่างกาย" },
        { q: "มือใหม่ควรซื้ออุปกรณ์อะไรเป็นชิ้นแรก?",

          a: "แนะนำเรียงตามความจำเป็น\n1. รองเท้าผ้าใบที่เหมาะกับกิจกรรม\n2. ยางยืดออกกำลังกาย (ราคาถูก ใช้ได้หลายท่า)\n3. ดัมเบลแบบปรับน้ำหนักได้\n4. เชือกกระโดด\n5. เสื่อ" },
        { q: "สามารถออกกำลังกายโดยไม่ใช้อุปกรณ์ได้หรือไม่?",
          k: ["โดยไม่ใช้อุปกรณ์", "ไม่ใช้อุปกรณ์ได้", "ไม่มีอุปกรณ์"],
          a: "ได้ ท่าที่ใช้น้ำหนักตัว เช่น squat, push-up, lunge, plank, glute bridge, jumping jack ให้ผลดีโดยไม่ต้องใช้อุปกรณ์เลย เหมาะกับคนที่เพิ่งเริ่มหรืออยากออกกำลังกายที่บ้าน" }

  // หัวข้อทั่วไป (ทักทาย / ใครสร้าง) ที่ไม่อยู่ในหมวด
  const extras = [
    { k: ["สวัสดี", "หวัดดี", "hello", "hi", "ดีครับ", "ดีค่ะ"],
      a: "สวัสดีครับ ยินดีให้คำแนะนำเกี่ยวกับการออกกำลังกาย 😊" },
    { k: ["ใครทำ", "ผู้สร้าง", "ใครสร้าง", "เจ้าของ"],
      a: "บอทตัวนี้สร้างโดยเจ เป็นผลงานในพอร์ตโฟลิโอเพื่อสมัครเรียนคณะเทคโนโลยีสารสนเทศ เขียนด้วย HTML, CSS และ JavaScript" }
  ];

  // คำตอบเมื่อบอทไม่เข้าใจคำถาม
  const fallback = "ขอโทษครับ น้องฟิตยังไม่เข้าใจคำถามนี้ 😅 ลองพิมพ์ใหม่ด้วยคำสั้นๆ เช่น squat, โปรตีน, วอร์มอัพ หรือกดเลือกหมวดด้านล่างได้เลยครับ";


  // ===== 2) ส่วนเชื่อมกับหน้าเว็บ =====
  const chat  = document.getElementById("chat");
  const quick = document.getElementById("quick");
  const form  = document.getElementById("form");
  const input = document.getElementById("input");

  // เพิ่มข้อความใหม่ลงในกล่องแชท
  function addMessage(text, who) {
    const div = document.createElement("div");
    div.className = "msg " + who;   // who = "bot" หรือ "user"
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight; // เลื่อนลงล่างสุดอัตโนมัติ
  }


  // ===== 3) สมองของบอท =====
  // รวมทุกหัวข้อไว้ในรายการเดียวสำหรับค้นหาจากข้อความที่พิมพ์
  const allItems = extras.slice();
  categories.forEach(function (cat) {
    cat.items.forEach(function (item) { allItems.push(item); });
  });

  // ให้คะแนนแต่ละหัวข้อ: เจอคำสำคัญไหน ก็บวกคะแนนเท่าความยาวคำนั้น
  // (คำยาวและเฉพาะเจาะจงจึงมีน้ำหนักมากกว่าคำสั้น) แล้วเลือกหัวข้อที่ได้คะแนนสูงสุด
  function findAnswer(question) {
    const q = question.toLowerCase();
    let best = null;
    let bestScore = 0;

    for (const item of allItems) {
      let score = 0;
      for (const k of item.k) {
        if (q.includes(k.toLowerCase())) score += k.length;
      }
      if (score > bestScore) {
        best = item;
        bestScore = score;
      }
    }
    return best ? best.a : fallback;
  }

  // เมื่อมีคำถามเข้ามา: โชว์คำถาม -> รอ 0.5 วินาที -> โชว์คำตอบ
  // ถ้ากดจากปุ่ม จะส่ง item มาด้วย เพื่อตอบตรงข้อ 100%
  function ask(text, item) {
    addMessage(text, "user");
    setTimeout(function () {
      addMessage(item ? item.a : findAnswer(text), "bot");
    }, 500);
  }


  // ===== 4) ปุ่มเลือกหมวดและปุ่มคำถาม =====
  function showCategories() {
    quick.innerHTML = "";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = "เลือกหมวดที่สนใจ:";
    quick.appendChild(title);

    categories.forEach(function (cat) {
      const btn = document.createElement("button");
      btn.textContent = cat.name;
      btn.addEventListener("click", function () { showQuestions(cat); });
      quick.appendChild(btn);
    });
  }

  function showQuestions(cat) {
    quick.innerHTML = "";

    const back = document.createElement("button");
    back.textContent = "← กลับไปเลือกหมวด";
    back.className = "back";
    back.addEventListener("click", showCategories);
    quick.appendChild(back);

    cat.items.forEach(function (item) {
      const btn = document.createElement("button");
      btn.textContent = item.q;
      btn.addEventListener("click", function () { ask(item.q, item); });
      quick.appendChild(btn);
    });
  }


  // ===== 5) เริ่มทำงาน =====
  form.addEventListener("submit", function (e) {
    e.preventDefault();               // กันหน้าเว็บรีโหลด
    const text = input.value.trim();
    if (text === "") return;
    input.value = "";
    ask(text);
  });

  addMessage("สวัสดีครับ ยินดีให้คำแนะนำเกี่ยวกับการออกกำลังกาย", "bot");
  showCategories();
</script>
